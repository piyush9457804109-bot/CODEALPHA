<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery Project</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h2>My Image Gallery</h2>
        <div class="filter-tags">
            <button class="btn active" data-cat="all">All</button>
            <button class="btn" data-cat="nature">Nature</button>
            <button class="btn" data-cat="city">City</button>
            <button class="btn" data-cat="animals">Animals</button>
        </div>
    </header>

    <div class="img-grid">
        <div class="pic-box nature">
            <img src="https://images.unsplash.com/photo-1472214103451-9374bd1c798e?w=600&q=80" alt="Nature">
        </div>
        <div class="pic-box city">
            <img src="https://images.unsplash.com/photo-1449824913935-59a10b8d2000?w=600&q=80" alt="City">
        </div>
        <div class="pic-box animals">
            <img src="https://images.unsplash.com/photo-1543466835-00a7907e9de1?w=600&q=80" alt="Dog">
        </div>
        <div class="pic-box nature">
            <img src="https://images.unsplash.com/photo-1501854140801-50d01698950b?w=600&q=80" alt="Mountains">
        </div>
        <div class="pic-box city">
            <img src="https://images.unsplash.com/photo-1477959858617-67f85cf4f1df?w=600&q=80" alt="Cityscape">
        </div>
        <div class="pic-box animals">
            <img src="https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?w=600&q=80" alt="Cat">
        </div>
    </div>

    <div id="gallery-popup" class="popup-box">
        <span class="close-popup">&times;</span>
        <button class="nav-arrow left-arrow">&#10094;</button>
        <img src="" id="popup-img" alt="Preview">
        <button class="nav-arrow right-arrow">&#10095;</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
