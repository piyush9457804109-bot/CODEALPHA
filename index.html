<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Music Player</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="player-container">
        <audio id="audio-engine"></audio>

        <div class="track-info">
            <div class="cover-art">
                <img id="track-cover" src="https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?w=400&q=80" alt="Album Cover">
            </div>
            <h2 id="track-title">Song Title</h2>
            <p id="track-artist">Artist Name</p>
        </div>

        <div class="progress-block">
            <span id="current-time">0:00</span>
            <input type="range" id="progress-bar" min="0" max="100" value="0">
            <span id="total-duration">0:00</span>
        </div>

        <div class="controls-row">
            <button class="ctrl-btn" id="prev-btn">⏮</button>
            <button class="ctrl-btn main-play" id="play-btn">▶</button>
            <button class="ctrl-btn" id="next-btn">⏭</button>
        </div>

        <div class="volume-block">
            <span>🔈</span>
            <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="0.7">
            <span>🔊</span>
        </div>

        <div class="playlist-tray">
            <h3>Up Next</h3>
            <ul id="playlist-list">
                </ul>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
